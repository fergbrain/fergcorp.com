<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fergcorp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece6d8;
    --card-bg: #faf7f0;
    --ink: #2a2419;
    --ink-soft: #756a59;
    --accent: #9a6a2f;
    --rule: #d9d0bd;
    --shadow: rgba(42, 36, 25, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131110;
      --card-bg: #1e1b17;
      --ink: #efe8da;
      --ink-soft: #a89a83;
      --accent: #d7a75d;
      --rule: #3b352b;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #131110;
    --card-bg: #1e1b17;
    --ink: #efe8da;
    --ink-soft: #a89a83;
    --accent: #d7a75d;
    --rule: #3b352b;
    --shadow: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    padding-block: max(32px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  }

  .stage {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    aspect-ratio: 7 / 4;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: 0 24px 60px -24px var(--shadow), 0 2px 8px -2px var(--shadow);
    padding: clamp(18px, 5.5%, 30px) clamp(20px, 6%, 32px);
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: clamp(14px, 4%, 24px);
    container-type: inline-size;
  }

  .crop {
    position: absolute;
    width: 12px;
    height: 12px;
    border: 1px solid var(--rule);
    opacity: 0.9;
  }
  .crop.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .crop.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

  .card-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .card-col.brand {
    flex: 1.05;
    justify-content: center;
  }

  .card-col.info {
    flex: 1;
    justify-content: space-between;
    align-items: flex-end;
    text-align: right;
  }

  .divider {
    width: 1px;
    background: var(--rule);
    flex: none;
    align-self: stretch;
  }

  .wordmark {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(17px, 6.5cqi, 27px);
    letter-spacing: -0.01em;
    line-height: 1.05;
    color: var(--ink);
  }

  .wordmark em {
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }

  .tagline {
    margin-top: clamp(4px, 1.5%, 8px);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(7px, 2cqi, 9.5px);
    line-height: 1.6;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .brand-text {
    width: fit-content;
    max-width: 100%;
  }

  .tagline-indent {
    display: block;
    text-align: right;
  }

  .who {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .who .name {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(12px, 4.2cqi, 16px);
    font-weight: 500;
    color: var(--ink);
  }

  .who .title {
    margin-top: 3px;
    font-size: clamp(8.5px, 2.6cqi, 11px);
    font-style: italic;
    color: var(--accent);
  }

  .contact {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }

  .email {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(7px, 2cqi, 9.5px);
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
  }

  .email:hover,
  .email:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
  }

  .footer {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(7px, 2cqi, 9.5px);
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .caption {
    max-width: 400px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0;
  }

  .caption a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1.5px solid var(--accent);
    padding-bottom: 1px;
  }

  .caption a:hover,
  .caption a:focus-visible {
    color: var(--accent);
  }

  .caption .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .caption .status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card {
      animation: rise 0.5s ease-out;
    }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <span class="crop tl" aria-hidden="true"></span>
    <span class="crop br" aria-hidden="true"></span>

    <div class="card-col brand">
      <div class="brand-text">
        <div class="wordmark">Ferg<em>corp</em>, LLC</div>
        <div class="tagline">Curiosity&hellip;<br><span class="tagline-indent">followed wherever it leads</span></div>
      </div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="card-col info">
      <div class="who">
        <div class="name">Andrew Ferguson</div>
        <div class="title">Founder &amp; Chief Tinkering Officer</div>
      </div>
      <div class="contact">
        <a class="email" href="mailto:andrew@fergcorp.com">andrew@fergcorp.com</a>
        <div class="footer">fergcorp.com</div>
      </div>
    </div>
  </div>

  <p class="caption">
    Currently building
    <a href="https://dialapodcast.com" target="_blank" rel="noopener">Dial-a-Podcast</a>
    &mdash; <span class="status">not accepting new clients</span>
  </p>
</div>

</body>
</html>
